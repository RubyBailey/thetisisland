name = "thetisisland-fire-hazard"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Run every hour
[triggers]
crons = ["0 * * * *"]

# KV namespace for storing the scraped rating
[[kv_namespaces]]
binding = "FIRE_KV"
id = "34e92dfe8ab140c0ac7e9dcab92aaedb"

[vars]
# Comma-separated list of allowed origins for CORS
ALLOWED_ORIGINS = "https://thetisisland.net,https://www.thetisisland.net,https://thetisisland.pages.dev,https://main.thetisisland.pages.dev,https://staging.thetisisland.pages.dev,https://staging2.thetisisland.pages.dev"

# Isolated staging Worker. Staging KV must have its own namespace ID.
[env.staging]
name = "thetisisland-fire-hazard-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "https://staging.thetisisland.pages.dev,https://staging2.thetisisland.pages.dev"

# Independent hourly update, never touches production KV.
[env.staging.triggers]
crons = ["0 * * * *"]

[[env.staging.kv_namespaces]]
binding = "FIRE_KV"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"
